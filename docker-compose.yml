services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with PostGIS 3.4 Spatial Extension
  # ----------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: nexusmap-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusmap}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexusmap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Redis 7 for Spatial Pub/Sub & Fast Zone Caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexusmap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_secret_change_in_prod}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret_change_in_prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Spring Boot 3 Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusmap-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB:-nexusmap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password_change_in_prod}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_secret_change_in_prod}
      NEXUSMAP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Next.js Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusmap-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8080}/ws
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - nexus-network

volumes:
  postgis_data:
  redis_data:

networks:
  nexus-network:
    driver: bridge
