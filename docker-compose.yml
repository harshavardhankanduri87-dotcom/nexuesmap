services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with PostGIS 3.4 Spatial Extension
  # ----------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: nexusmap-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusmap}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
    expose:
      - "5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexusmap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Redis 7 for Spatial Pub/Sub & Fast Zone Caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexusmap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password must be provided}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Spring Boot 3 Backend Service (Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusmap-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB:-nexusmap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEXUSMAP_JWT_SECRET: ${JWT_SECRET:?JWT secret must be provided}
      NEXUSMAP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1}
      PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Next.js 14 Frontend Service (Standalone Node.js Output)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusmap-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_MAP_DEFAULT_LAT: ${NEXT_PUBLIC_MAP_DEFAULT_LAT:-37.7749}
      NEXT_PUBLIC_MAP_DEFAULT_LNG: ${NEXT_PUBLIC_MAP_DEFAULT_LNG:--122.4194}
      NEXT_PUBLIC_MAP_DEFAULT_ZOOM: ${NEXT_PUBLIC_MAP_DEFAULT_ZOOM:-14}
      NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with TLS/SSL & WebSocket Gateway
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nexusmap-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus-network

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local

networks:
  nexus-network:
    driver: bridge
